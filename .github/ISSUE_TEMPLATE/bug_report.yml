name: Bug report
description: Report a reproducible non-security bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include security-sensitive exploit details here.**
        Read SECURITY.md first if the issue crosses a trust or authority boundary.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, commands, or fixture needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version, commit SHA.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: I confirm this report does not contain a security-sensitive exploit or secret.
          required: true
