# Menog OS — licence verification (OPTIONAL, manual only)
#
# Public-state reconciliation (2026-10-07):
#   * MPL-2.0 and the collective holder label "Menog OS contributors" are ratified.
#   * LICENSE, LICENSES/, and .reuse/REUSE.toml are present in the public tree.
#   * This workflow remains manual because first-party artefact presence and the
#     third-party licence inventory are verification utilities, while remaining
#     REUSE per-file/schema work and third-party acceptance decisions are tracked
#     separately. This workflow does not publish, deploy, or grant merge authority.
#
# Deliberate authoring choices:
#   * Actions use bounded upstream version tags rather than @main / @master.
#   * Permissions are read-only. No write token. No secret is consumed.
#   * No deployment, release, or registry publishing occurs here.
#   * The third-party check reads pnpm's installed inventory after a frozen-lockfile install.
#
name: License (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  first-party-licence-presence:
    name: first-party licence presence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The ratified first-party licence surface is expected to be present.
      # Absence of any required artefact is a hard verification failure.
      - name: Require the first-party licence artefacts
        run: |
          missing=0
          for f in LICENSE LICENSES .reuse/REUSE.toml; do
            if [ ! -e "$f" ]; then
              echo "::error title=Missing licence artefact::${f} is required by the ratified public licence surface"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Required first-party licence artefacts are missing."
            echo "The public licence surface is inconsistent; fail closed."
            exit 1
          fi
          echo "First-party licence artefacts present."

  third-party-licences:
    name: third-party licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (version read from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Reject unknown or copyleft third-party licences
        run: |
          pnpm licenses list --json > "$RUNNER_TEMP/licenses.json"
          node -e '
          const fs = require("node:fs");
          const inventory = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/licenses.json", "utf8"));
          const DENY = /UNKNOWN|GPL|AGPL|SSPL|BUSL|CPAL|EUPL|OSL|CC-BY-NC|CC-BY-SA/i;
          let packages = 0;
          const rejected = [];
          const counts = {};
          for (const [licence, entries] of Object.entries(inventory)) {
            counts[licence] = (counts[licence] || 0) + entries.length;
            for (const entry of entries) {
              packages += 1;
              if (DENY.test(licence)) rejected.push(`${entry.name} :: ${licence}`);
            }
          }
          console.log(`third-party packages: ${packages}`);
          console.log(`licences: ${JSON.stringify(counts)}`);
          if (rejected.length > 0) {
            console.error("rejected licences:");
            for (const r of rejected) console.error(`  ${r}`);
            process.exit(1);
          }
          console.log("no unknown or copyleft third-party licences found");
          '
