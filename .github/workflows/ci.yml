# Menog OS — continuous integration
#
# Deliberate authoring choices (GP-R12):
#   * Actions are pinned to a MAJOR version tag, chosen from the upstream
#     release list at authoring time — never @main / @master.
#   * Permissions are read-only. No job requests a write token.
#   * No step consumes a repository secret, deploys, or publishes to any
#     registry (npm, container, or otherwise).
#   * The pnpm store cache comes from actions/setup-node. Every install step
#     runs `pnpm install --frozen-lockfile`, so a cache hit or miss can never
#     change lockfile semantics or dependency resolution.
#   * `defaults.run.shell: bash` keeps the steps identical on every runner.
#
# CURRENT PUBLIC CI STATE (FPR-R8, 2026-10-07):
#   The approved public Vitest surface is 110 test files / 3031 tests.
#   Every job is self-contained: the test job installs, builds, then tests in
#   its own checkout. Target-specific WSL2 qualifications use explicit skipIf
#   gates rather than failing portable Linux CI when that target is unavailable.
#   No blocking test is wrapped in continue-on-error.
#
# Node version: the workspace declares engines.node ">=22.0.0"; CI pins Node 24,
# the exercised major for this release candidate. A 22/24 matrix remains a
# deliberate follow-up once the Node 22 leg is qualified.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  install:
    name: install (frozen lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (version read from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (version read from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (version read from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm (version read from packageManager)
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
