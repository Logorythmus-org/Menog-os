# REUSE.toml — Menog OS licensing metadata
# Classification: PUBLIC (REUSE config)
# Generated: 2026-09-05 (PROMPT 11A §7)
# Updated: 2026-10-06 — licence and copyright holder ratified.
# Status: RATIFIED. Copyright holder of record = "Menog OS contributors".
#
# IMPORTANT:
# - COPYRIGHT_HOLDER_OF_RECORD_DAY1 = "Menog OS contributors" (ratified
#   2026-10-06; see COPYRIGHT_POLICY.md §Resolved Holder and
#   IP_DECISION_LOG.md entries IP-001 / IP-002). The label is a collective
#   attribution and names no legal entity, so it asserts no corporate
#   ownership.
# - The annotations below are the REUSE-native declaration of the holder for
#   paths that cannot carry an in-file header. In-file
